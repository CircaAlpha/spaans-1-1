<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

</head><body>
<title>Plan de Español 1.1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: one study-desk column; sticky tab rail; azulejo tile band as the only ornament */
:root{
  --bg:#f3f5fb; --surface:#ffffff; --sunk:#e9edf7; --ink:#141c33; --muted:#566079; --line:#d7ddeb;
  --cobalt:#1d4ed8; --cobalt-ink:#ffffff; --cobalt-soft:#dfe7ff; --saffron:#e7a800; --saffron-soft:#fff2c9;
  --good:#16794c; --good-soft:#dcf3e7; --bad:#b9302a; --bad-soft:#fbe1df; --warn:#9a5b00; --warn-soft:#fdebd0;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:14px; --on-saffron:#2a1d00; --scrim:rgba(6,10,24,.62);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1322; --surface:#161d31; --sunk:#1c2540; --ink:#e7ebf6; --muted:#9aa4c0; --line:#2a3453;
  --cobalt:#7397ff; --cobalt-ink:#0b1020; --cobalt-soft:#22305a; --saffron:#f4c64a; --saffron-soft:#3a3016;
  --good:#4cc68d; --good-soft:#163a2a; --bad:#ff8077; --bad-soft:#47201e; --warn:#f2a94a; --warn-soft:#41301a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1322; --surface:#161d31; --sunk:#1c2540; --ink:#e7ebf6; --muted:#9aa4c0; --line:#2a3453;
  --cobalt:#7397ff; --cobalt-ink:#0b1020; --cobalt-soft:#22305a; --saffron:#f4c64a; --saffron-soft:#3a3016;
  --good:#4cc68d; --good-soft:#163a2a; --bad:#ff8077; --bad-soft:#47201e; --warn:#f2a94a; --warn-soft:#41301a;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* tile band */
.tiles{height:14px;background:
  radial-gradient(circle at 50% 50%, var(--saffron) 0 3px, transparent 3.5px) 0 0/28px 14px,
  conic-gradient(from 45deg, var(--cobalt) 0 25%, transparent 0 50%, var(--cobalt) 0 75%, transparent 0) 0 0/14px 14px,
  var(--cobalt-soft)}
header.top{padding-block:18px 14px}
.brand{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.brand h1{font-size:clamp(1.7rem,4.5vw,2.4rem);font-weight:800;letter-spacing:-.01em}
.brand h1 em{font-style:normal;color:var(--cobalt)}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.count{display:flex;align-items:baseline;gap:10px;padding:8px 14px;border-radius:12px;background:var(--saffron-soft);border:1px solid color-mix(in srgb,var(--saffron) 45%,transparent)}
.count b{font-family:var(--display);font-size:2.2rem;line-height:1;font-weight:800}
.count span{font-size:.85rem;line-height:1.25}
.sync{font-size:.78rem;color:var(--muted);margin-top:8px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabrail{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.tabrail::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:700;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab:hover:not([aria-selected="true"]){background:var(--sunk);color:var(--ink)}
main{padding-block:22px 64px}
section[role=tabpanel]{display:flex;flex-direction:column;gap:20px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--cobalt-ink)}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;font-size:.85rem;border-radius:8px}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.class{background:var(--cobalt-soft);color:var(--cobalt)}
.chip.exam{background:var(--bad-soft);color:var(--bad)}
.chip.test{background:var(--saffron-soft);color:var(--warn)}
.chip.free{background:var(--good-soft);color:var(--good)}
.pg{font-family:var(--mono);font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.bar{display:block;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cobalt);border-radius:99px}
.bar.good i{background:var(--good)}
input[type=text],textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.hide{display:none!important}

/* today */
.today-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
.today-head .date{font-family:var(--display);font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800}
.today-head .date::first-letter{text-transform:uppercase}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;background:var(--surface);font-size:.78rem;min-width:0}
.wd b{display:block;font-family:var(--display);font-size:1.05rem}
.wd.now{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}
.wd .dot{display:block;height:5px;border-radius:9px;margin:4px 6px 0;background:var(--sunk)}
.wd .dot.part{background:var(--saffron)} .wd .dot.full{background:var(--good)}
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .txt{min-width:0}
.task .txt small{display:block;color:var(--muted);font-size:.8rem}
.task.done .txt span{text-decoration:line-through;color:var(--muted)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.check svg{width:16px;height:16px;opacity:0}
.task.done .check{background:var(--good);border-color:var(--good)}
.task.done .check svg{opacity:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:14px;border-radius:12px;background:var(--sunk)}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:800;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.callout{border-left:4px solid var(--saffron);padding:10px 14px;background:var(--saffron-soft);border-radius:0 10px 10px 0;font-size:.92rem}
.callout.blue{border-color:var(--cobalt);background:var(--cobalt-soft)}

/* plan */
.weekblock{display:flex;flex-direction:column;gap:6px}
.weekblock h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.weekblock h3 small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.85rem}
details.day{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.day[open]{border-color:var(--cobalt)}
details.day summary{list-style:none;display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
details.day summary::-webkit-details-marker{display:none}
details.day .dd{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
details.day.is-today .dd{color:var(--cobalt);font-weight:600}
details.day .dt{min-width:0;font-weight:700}
details.day .prog{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
details.day.full .prog{color:var(--good)}
details.day .tasks{padding:0 14px 6px}

/* vocab */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.deck{display:flex;flex-direction:column;gap:10px}
.deck .meta{display:flex;gap:12px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-weight:700;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:46px 18px 28px;border-radius:18px;background:var(--surface);border:1px solid var(--line);position:relative}
.flash .front{font-family:var(--display);font-size:clamp(1.5rem,5vw,2.3rem);font-weight:700;overflow-wrap:anywhere}
.flash .back{font-family:var(--display);font-size:clamp(1.3rem,4.4vw,1.9rem);font-weight:700;color:var(--cobalt);overflow-wrap:anywhere}
.flash .lbl{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flash .corner{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:460px}
.grades .btn{justify-content:center}
.kbd{font-family:var(--mono);font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.fb{padding:10px 14px;border-radius:10px;font-weight:700}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.accent{background:var(--warn-soft);color:var(--warn)}
.fb.wrong{background:var(--bad-soft);color:var(--bad)}
.tablewrap{overflow-x:auto}
table.list{border-collapse:collapse;width:100%;font-size:.92rem}
table.list td,table.list th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.list th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.box{font-family:var(--mono);font-size:.75rem}

/* grammar */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.topic{text-align:left;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px}
.topic:hover{border-color:var(--cobalt)}
.topic b{font-family:var(--display);font-size:1.02rem}
.note{display:flex;flex-direction:column;gap:12px}
.note table{border-collapse:collapse;font-size:.93rem}
.note td,.note th{border:1px solid var(--line);padding:5px 9px;text-align:left}
.note th{background:var(--sunk);font-size:.8rem}
.note ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.end{color:var(--cobalt);font-weight:700}
.conjgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.drill{display:flex;flex-direction:column;gap:12px}
.drill .prompt{font-family:var(--display);font-size:1.35rem;font-weight:700;overflow-wrap:anywhere}
.drill .hint{color:var(--muted);font-size:.9rem}
.syl{display:flex;gap:6px;flex-wrap:wrap}
.syl button{font-family:var(--display);font-size:1.5rem;font-weight:700;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface)}
.syl button.right{border-color:var(--good);background:var(--good-soft)}
.syl button.wrongpick{border-color:var(--bad);background:var(--bad-soft)}

/* test */
.tq{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.tq:first-of-type{border-top:0}
.tq .s{font-size:1.02rem}
.inline{display:inline-block;width:9.5em;max-width:100%;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);margin:0 4px}
.tq.ok .res{color:var(--good)} .tq.accent .res{color:var(--warn)} .tq.wrong .res{color:var(--bad)}
.res{font-size:.9rem;font-weight:700}
.score{font-family:var(--display);font-size:2.6rem;font-weight:800;line-height:1}

/* speak */
.qa{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.qa:first-child{border-top:0}
.qa .q{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qa textarea{min-height:58px}
.say{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;padding:0;flex:none}
.say:hover{border-color:var(--cobalt);color:var(--cobalt)}
.say svg{width:16px;height:16px}
.reads{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ticks{display:flex;gap:6px}
.ticks button{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:.8rem}
.ticks button[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.tl{display:flex;flex-direction:column;gap:8px}
.tl .t{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.tl .t i{font-style:normal;color:var(--muted);font-size:.88rem;display:block}
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.alpha button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px;text-align:center}
.alpha b{display:block;font-family:var(--display);font-size:1.2rem}
.alpha span{font-size:.78rem;color:var(--muted)}
.spellout{font-family:var(--display);font-size:1.2rem;font-weight:700;color:var(--cobalt)}

/* write */
.wgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.cl{display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.cl div{display:grid;grid-template-columns:20px 1fr;gap:6px}
.cl .y{color:var(--good);font-weight:700}
.cl .n{color:var(--muted)}
.email{white-space:pre-wrap;font-size:.95rem;background:var(--sunk);border-radius:10px;padding:12px}

/* game */
.hud{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin-top:14px}
.lvl{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);min-width:0;flex:1 1 240px;text-align:left}
.lvl:hover{border-color:var(--cobalt)}
.medal{width:36px;height:36px;flex:none;border-radius:50%;background:var(--cobalt);color:var(--cobalt-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.lvl .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.lvl .info b{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl .info small{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl .bar{height:6px}
.lvl .bar i{background:var(--saffron)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.9rem}
.pill svg{width:20px;height:20px;flex:none}
.pill.flame{color:var(--muted)}
.pill.flame.on{color:var(--warn);background:var(--saffron-soft);border-color:color-mix(in srgb,var(--saffron) 55%,transparent)}
.ring .trk{stroke:var(--sunk)} .ring .val{stroke:var(--good)}
.xpf{position:fixed;z-index:60;pointer-events:none;font-family:var(--display);font-weight:800;color:var(--good);background:var(--surface);border:1px solid var(--line);padding:2px 10px;border-radius:999px;white-space:nowrap;animation:xpup 1s ease-out forwards}
@keyframes xpup{from{transform:translateY(0);opacity:1}to{transform:translateY(-46px);opacity:0}}
.toasts{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 25%,transparent);animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.modal{position:fixed;inset:0;z-index:80;background:var(--scrim);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .card{max-width:420px;width:100%;text-align:center;animation:tin .3s ease-out}
.fact{font-family:var(--display);font-size:1.1rem;font-weight:700}
.confetti{position:fixed;inset:0;z-index:90;pointer-events:none}
.route{display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:start;padding:10px 0;position:relative}
.stop::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--line)}
.stop:first-child::before{top:18px}
.stop:last-child::before{bottom:auto;height:18px}
.stop.past::before{background:var(--cobalt)}
.pin{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;border:3px solid var(--line);background:var(--surface);margin-top:1px}
.stop.past .pin{background:var(--cobalt);border-color:var(--cobalt)}
.stop.here .pin{background:var(--saffron);border-color:var(--cobalt);box-shadow:0 0 0 5px var(--saffron-soft)}
.stop.next .sinfo>b{color:var(--muted)}
.sinfo{min-width:0;display:flex;flex-direction:column;gap:3px}
.sinfo .fact{font-size:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ach{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:10px;border-radius:12px;border:1px dashed var(--line);opacity:.62}
.ach.on{opacity:1;border-style:solid;background:var(--surface)}
.ach div{display:flex;flex-direction:column;min-width:0}
.badge{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.95rem;background:var(--sunk);color:var(--muted)}

<script>
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)};
const todayISO=()=>iso(new Date());
const diffDays=(a,b)=>Math.round((parseISO(b)-parseISO(a))/86400000);
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS3=['dom','lun','mar','mié','jue','vie','sáb'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtES=s=>{const d=parseISO(s);return DIAS[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()]};
const fmtShort=s=>{const d=parseISO(s);return DIAS3[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>String(s).toLowerCase().replace(/[¿?¡!.,;:"“”«»…]/g,' ').replace(/\s+/g,' ').trim();
const strip=s=>norm(s).normalize('NFD').replace(/[̀-ͯ]/g,'');
function variants(a){const out=new Set([a]);if(/\(/.test(a)){out.add(a.replace(/[()]/g,''));out.add(a.replace(/\s*\([^)]*\)/g,''))}return [...out]}
function grade(input,accepted){
  const all=accepted.flatMap(variants);
  if(!norm(input))return 'wrong';
  if(all.some(a=>norm(a)===norm(input)))return 'ok';
  if(all.some(a=>strip(a)===strip(input)))return 'accent';
  return 'wrong';
}

/* ============ speech ============ */
let VOICE=null;
const canSpeak='speechSynthesis' in window;
function pickVoice(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/^es[-_]ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null}catch(e){}}
if(canSpeak){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function say(t){
  if(!canSpeak)return;
  try{speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(t).replace(/\s\/\s/g,', ').replace(/[()…]/g,' ').replace(/___/g,' '));
    u.lang='es-ES';if(VOICE)u.voice=VOICE;u.rate=.88;speechSynthesis.speak(u)}catch(e){}
}
const sayBtn=t=>canSpeak?`<button class="say" data-say="${esc(t)}" aria-label="Listen" title="Listen">${ICON.sound}</button>`:'';

/* ============ state ============ */
const KEY='plan-espanol-1-1';
const blank=()=>({v:1,done:{},cards:{},drills:{},tests:[],oral:{},oralMark:{},write:'',reads:{},set:{dir:'nl',mode:'flip'},xp:0,xpDay:{},ach:{},best:{},taskXP:{},dayBonus:{},readXP:{},flags:{},sound:true,updated:0});
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw))}catch(e){}
let dbRef=null,writing=false,pending=false,saveTimer=null;
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,1200);
}
async function pushRemote(){
  if(!dbRef)return;
  if(writing){pending=true;return}
  writing=true;
  try{await dbRef.set({json:JSON.stringify(S),updated:S.updated});setSync('Progress saved to your account — it follows you to any device.')}
  catch(e){setSync('Could not reach your account just now; progress is kept in this browser.')}
  writing=false;
  if(pending){pending=false;pushRemote()}
}
function setSync(t){$('#sync').textContent=t}
(async()=>{
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();
    if(!id)return;
    dbRef=db.doc('data/users/'+id+'/state');
    const snap=await dbRef.get();
    if(snap.exists){
      const d=snap.data();
      if(d&&d.json&&(d.updated||0)>(S.updated||0)){
        S=Object.assign(blank(),JSON.parse(d.json));
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        renderAll();
      }else if((S.updated||0)>(d.updated||0)){pushRemote()}
    }else if(S.updated){pushRemote()}
    setSync('Progress saved to your account — it follows you to any device.');
  }catch(e){}
})();

  if(/[aeiouns]/.test(last))return `Ends in “${last}” (vowel, n or s) → stress on the second-to-last syllable. Rule 1.`;

  return `<div class="task${done?' done':''}"><button class="check" data-toggle="${t.id}" aria-label="${done?'Mark not done':'Mark done'}" aria-pressed="${done}">${ICON.check}</button><div class="txt"><span>${esc(t.text)}</span>${t.min?`<small>about ${t.min} min</small>`:''}</div>${open}</div>`;

document.addEventListener('click',e=>{
  const tg=e.target.closest('[data-toggle]');

  const op=e.target.closest('[data-open]');

  const k=t.kind,a=t.arg;
  if(k==='vocab'){go('vocab');startSession(a)}

  else if(k==='oral'){go('speak');if(a==='interview')startInterview();else $('#oral-list')?.scrollIntoView({behavior:'smooth'})}
  else if(k==='read'){go('speak');$('#reads')?.scrollIntoView({behavior:'smooth'})}
  else if(k==='pron'){go('speak');(a==='spell'?$('#spell'):$('#pron'))?.scrollIntoView({behavior:'smooth'})}

function startSession(deck,cram){
  const t=todayISO();
  const ids=deck==='all'?Object.keys(CARDS):DECKS.find(d=>d.id===deck).ids;
  let due=shuffle(ids.filter(id=>S.cards[id]&&S.cards[id].d<=t));
  let nw=deck==='all'?[]:ids.filter(id=>!S.cards[id]).slice(0,12);
  let q=[...due,...nw];
  if(cram)q=shuffle(ids).slice(0,20);
  SESSION={deck,q,i:0,shown:false,total:q.length,cram:!!cram,right:0,againSet:new Set(),typed:null};
  if(!q.length)return emptySession(deck);
  renderCard();
}
function emptySession(deck){
  const d=DECKS.find(x=>x.id===deck);

}
function renderCard(){
  const s=SESSION;
  if(s.i>=s.q.length)return finishSession();
  const c=CARDS[s.q[s.i]];
  const front=S.set.dir==='nl'?c.nl:c.es, back=S.set.dir==='nl'?c.es:c.nl;

  <div class="spread"><button class="btn sm ghost" data-act="quit">← Decks</button><span class="row">${(s.combo||0)>=3?`<span class="chip test">combo ×${s.combo}</span>`:''}<span class="mono small">${Math.min(s.i+1,s.q.length)} / ${s.q.length}</span></span></div>

    $('#act').innerHTML=`<button class="btn primary" data-act="show">Show answer <span class="kbd">Space</span></button>`;

}
function checkTyped(){
  const s=SESSION;const c=CARDS[s.q[s.i]];
  const v=$('#typed').value;
  s.typed=grade(v,cardAccepted(c.es));
  showAnswer();
}
function showAnswer(){
  const s=SESSION;if(!s||s.shown)return;s.shown=true;
  const c=CARDS[s.q[s.i]];
  const back=S.set.dir==='nl'?c.es:c.nl;
  let fb='';
  if(s.typed==='ok')fb='<div class="fb ok">Correct</div>';
  else if(s.typed==='accent')fb='<div class="fb accent">Almost: check the accent / ñ</div>';
  else if(s.typed==='wrong')fb='<div class="fb wrong">Not quite</div>';
  $('#ans').innerHTML=`${fb}<span class="lbl">${S.set.dir==='nl'?'Español':'Nederlands'}</span><div class="back">${esc(back)}</div>${sayBtn(c.es)}`;

  $('#act').innerHTML=`<div class="grades"><button class="btn ${sug==='again'?'bad':''}" data-act="grade" data-g="again">Again <span class="kbd">1</span></button><button class="btn" data-act="grade" data-g="hard">Hard <span class="kbd">2</span></button><button class="btn ${sug==='good'?'good':''}" data-act="grade" data-g="good">${s.typed==='wrong'?'I was right':'Good'} <span class="kbd">3</span></button></div>`;
  if(S.set.dir==='nl')say(c.es);
}
function gradeCard(g){
  const s=SESSION;const id=s.q[s.i];const t=todayISO();
  const c=S.cards[id]||{b:0,d:t,n:0};
  c.n=(c.n||0)+1;
  if(g==='again'){c.b=0;c.d=t;if(!s.againSet.has(id)){s.againSet.add(id);s.q.push(id)}}
  else if(g==='hard'){c.b=Math.max(1,Math.min(c.b,2));c.d=addDays(t,1);s.right+=.5}
  else{ if(!s.cram||c.d<=t){c.b=Math.min(5,c.b+1);c.d=addDays(t,INT[c.b])} s.right++}
  S.cards[id]=c;save();
  s.combo=g==='good'?(s.combo||0)+1:0;
  if(g==='good')sfx('ok');
  addXP(g==='good'?10+(s.combo>=5?5:0):g==='hard'?5:2,s.combo>=5?'combo ×'+s.combo:'');
  s.i++;renderCard();
}
function finishSession(){

  <div class="row"><button class="btn primary" data-act="quit">Back to decks</button></div></div>`;

}
document.addEventListener('keydown',e=>{

  else if(SESSION.shown&&['1','2','3'].includes(e.key)){gradeCard({1:'again',2:'hard',3:'good'}[e.key])}

function autoTick(kind,arg){

let DRILL=null;
function topicScore(id){const r=S.drills[id];return r&&r.n?r.ok/r.n:null}
function renderGrammar(){

$('#p-grammar').addEventListener('click',e=>{
  const tp=e.target.closest('[data-topic]');if(tp){openTopic(tp.dataset.topic,false);return}
  const b=e.target.closest('[data-act]');if(!b)return;

  else if(a==='drill')startDrill(b.dataset.id);
  else if(a==='dcheck')drillCheck();

  else if(a==='syl')stressPick(+b.dataset.i);
});
function openTopic(id,autoDrill){
  const t=TOPICS.find(x=>x.id===id);
  $('#p-grammar').innerHTML=`<div class="spread"><button class="btn sm ghost" data-act="back">← All topics</button><span class="pg">${t.pg}</span></div>
  <h2>${esc(t.title)}</h2>

  <div><button class="btn primary" data-act="drill" data-id="${id}" id="drillbtn">Start a 10-question drill</button></div>`;
  if(autoDrill)startDrill(id);
}
function startDrill(id){
  const t=TOPICS.find(x=>x.id===id);
  DRILL={id,t,i:0,n:10,ok:0,cur:null,answered:false,used:new Set()};
  $('#drillbtn')?.remove();
  drillNext(true);
  $('#drillbox').scrollIntoView({behavior:'smooth',block:'start'});
}
function newItem(t){
  if(t.type==='stress'){let it;do{it=pick(STRESS)}while(DRILL.used.has(it[0])&&DRILL.used.size<STRESS.length);DRILL.used.add(it[0]);return {stress:it}}
  let it,k=0;do{it=t.gen();k++}while(DRILL.used.has(it.prompt)&&k<20);DRILL.used.add(it.prompt);return it;
}
function drillNext(first){
  const d=DRILL;if(!first)d.i++;
  if(d.i>=d.n)return drillDone();
  d.cur=newItem(d.t);d.answered=false;
  const box=$('#drillbox');
  if(d.cur.stress){
    const [w,syl]=d.cur.stress;
    box.innerHTML=`<div class="card drill"><div class="spread"><span class="small muted">Question ${d.i+1} of ${d.n}</span><span class="mono small">${d.ok} correct</span></div>
    <div class="prompt">${esc(w)} ${sayBtn(w)}</div><p class="hint">Tap the stressed syllable</p>
    <div class="syl">${syl.map((s,i)=>`<button data-act="syl" data-i="${i}">${esc(s)}</button>`).join('')}</div><div id="dfb"></div><div id="dact"></div></div>`;
    return;
  }
  box.innerHTML=`<div class="card drill"><div class="spread"><span class="small muted">Question ${d.i+1} of ${d.n}</span><span class="mono small">${d.ok} correct</span></div>
  <div class="prompt">${d.cur.prompt}</div><p class="hint">${esc(d.cur.hint)}</p>
  <input type="text" id="dinput" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div id="dfb"></div><div class="row" id="dact"><button class="btn primary" data-act="dcheck">Check <span class="kbd">Enter</span></button></div></div>`;
  setTimeout(()=>$('#dinput')?.focus({preventScroll:true}),20);
}
function stressPick(i){
  const d=DRILL;if(d.answered)return;d.answered=true;
  const [w,syl,ix]=d.cur.stress;
  $$('#drillbox .syl button').forEach((b,j)=>{if(j===ix)b.classList.add('right');else if(j===i)b.classList.add('wrongpick')});
  const ok=i===ix;if(ok){d.ok++;addXP(15);sfx('ok')}else sfx('bad');
  $('#dfb').innerHTML=`<div class="fb ${ok?'ok':'wrong'}">${ok?'Correct':'Stress is on “'+esc(syl[ix])+'”'}</div><p class="small" style="margin-top:8px">${esc(stressWhy(w,syl,ix))}</p>`;
  $('#dact').innerHTML=`<button class="btn primary" data-act="dnext">Next <span class="kbd">Enter</span></button>`;
}
function drillCheck(){
  const d=DRILL;if(d.answered)return;
  const v=$('#dinput').value;
  const r=grade(v,d.cur.acc);d.answered=true;d.last=r;
  if(r==='ok')d.ok++;else if(r==='accent')d.ok+=.5;
  if(r==='ok'){addXP(15);sfx('ok')}else if(r==='accent')addXP(7);else sfx('bad');
  $('#dinput').readOnly=true;
  const msg={ok:'Correct',accent:'Almost: check the accents (½ point)',wrong:'Not quite'}[r];
  $('#dfb').innerHTML=`<div class="fb ${r}">${msg}</div><p style="margin-top:8px">Answer: <b>${esc(d.cur.acc[0])}</b> ${sayBtn(d.cur.speak||d.cur.acc[0])}</p>${d.cur.why&&d.cur.why!==d.cur.acc[0]?`<p class="small muted">${esc(d.cur.why)}</p>`:''}`;
  $('#dact').innerHTML=`<button class="btn primary" data-act="dnext">Next <span class="kbd">Enter</span></button>${r!=='ok'&&d.cur.lenient?`<button class="btn ghost" data-act="doverride">My answer was also right</button>`:''}`;
}
function drillOverride(){const d=DRILL;d.ok+=d.last==='accent'?.5:1;addXP(d.last==='accent'?8:15);d.last='ok';$('#dfb .fb').className='fb ok';$('#dfb .fb').textContent='Counted as correct';$('[data-act=doverride]')?.remove()}
function drillDone(){
  const d=DRILL;
  const r=S.drills[d.id]||{ok:0,n:0,rounds:0,best:0};
  r.ok+=d.ok;r.n+=d.n;r.rounds++;r.best=Math.max(r.best,d.ok);r.last=d.ok;S.drills[d.id]=r;save();
  if(d.ok>=10)addXP(50,'¡Perfecto!');else checkAch();
  autoTick('drill',d.id);
  $('#drillbox').innerHTML=`<div class="card stack" style="align-items:flex-start"><span class="chip ${d.ok>=8?'free':'test'}">Round done</span>
  <h3><span class="score mono">${Math.round(d.ok*10)/10}</span> / ${d.n}</h3>
  <p class="muted">${d.ok>=9?'Excellent. This topic is solid.':d.ok>=7?'Good. One more round tomorrow keeps it there.':'Read the note above once more, then try another round.'}</p>
  <div class="row"><button class="btn primary" data-act="drill" data-id="${d.id}">Another round</button><button class="btn" data-act="back">All topics</button></div></div>`;
  DRILL=null;
}
document.addEventListener('keydown',e=>{
  if(TAB!=='grammar'||!DRILL||e.key!=='Enter')return;
  e.preventDefault();
  if(DRILL.cur&&DRILL.cur.stress){if(DRILL.answered)drillNext();return}
  if(!DRILL.answered)drillCheck();else drillNext();
});

function newTest(){
  const A=shuffle(SENT).slice(0,10).map(([l,v,s])=>({k:'A',pre:`(${l} ${v.toUpperCase()})`,s,acc:[conj(v,persIdx(l))]}));
  const B=shuffle(PLS).slice(0,5).map(([s,a])=>({k:'B',s,acc:a.split('|')}));
  const C=shuffle(NEG).slice(0,5).map(([s,a])=>({k:'C',s,acc:[a]}));
  const D=shuffle(QW).slice(0,5).map(([s,h,a])=>({k:'D',s,h,acc:[a],len:true}));
  const E=shuffle(QA).slice(0,5).map(([s,a])=>({k:'E',s,acc:a,len:true}));
  TEST={items:[...A,...B,...C,...D,...E],checked:false};
  const sec=(k,title,body)=>`<div class="card stack"><h3>${k}. ${title}</h3><div>${body}</div></div>`;
  const it=TEST.items;
  const field=(i,ph)=>`<input type="text" id="t${i}" autocomplete="off" autocapitalize="off" spellcheck="false" ${ph?`placeholder="${ph}"`:''}>`;
  const row=(i,inner)=>`<div class="tq" id="q${i}">${inner}<div class="res" id="r${i}"></div></div>`;
  let html=`<div class="spread"><button class="btn sm ghost" data-act="home">← Back</button><span class="muted small">Write accents: á é í ó ú ñ ¿ ¡ (on a phone: hold the letter)</span></div><h2>Practice test</h2>`;
  html+=sec('A','Fill in the present tense (/10)',it.map((x,i)=>x.k!=='A'?'':row(i,`<div class="s">${esc(x.pre)} ${esc(x.s).replace('___',`<input type="text" class="inline" id="t${i}" autocomplete="off" autocapitalize="off" spellcheck="false">`)}</div>`)).join(''));
  html+=sec('B','Put in the plural (/5)',it.map((x,i)=>x.k!=='B'?'':row(i,`<div class="s">${esc(x.s)}</div>${field(i)}`)).join(''));
  html+=sec('C','Make it negative (/5)',it.map((x,i)=>x.k!=='C'?'':row(i,`<div class="s">${esc(x.s)}</div>${field(i)}`)).join(''));
  html+=sec('D','Ask a question with a question word (/5)',it.map((x,i)=>x.k!=='D'?'':row(i,`<div class="s">${esc(x.s)} <span class="muted small">(${esc(x.h)})</span></div>${field(i,'¿…?')}`)).join(''));
  html+=sec('E','Write the question for the answer (/5)',it.map((x,i)=>x.k!=='E'?'':row(i,`<div class="s">${esc(x.s)}</div>${field(i,'¿…?')}`)).join(''));
  html+=`<div class="card spread" id="tfoot"><button class="btn primary" data-act="checktest">Check my test</button><span class="muted small">Answers are checked all at once at the end.</span></div>`;
  $('#p-test').innerHTML=html;
}
function scoreTest(){return TEST.items.reduce((s,x)=>s+(x.r==='ok'?1:x.r==='accent'?.5:0),0)}
function checkTest(){
  if(TEST.checked)return;TEST.checked=true;
  TEST.items.forEach((x,i)=>{
    const v=$('#t'+i).value;x.r=grade(v,x.acc);$('#t'+i).readOnly=true;
    paintTQ(i);
  });
  const sc=scoreTest();
  S.tests.push({d:todayISO(),sc,max:30});TEST.hi=S.tests.length-1;save();
  addXP(Math.round(sc*5)+(sc>=24?100:0),'Practice test');
  autoTick('test','');
  footTest();
}
function paintTQ(i){
  const x=TEST.items[i];
  $('#q'+i).className='tq '+x.r;
  const m={ok:'✓ Correct',accent:'½ Check the accent:',wrong:'✗ Answer:'}[x.r];
  $('#r'+i).innerHTML=`${m} ${x.r==='ok'?'':`<b>${esc(x.acc[0].replace(/[()]/g,''))}</b>`} ${x.len&&x.r!=='ok'?`<button class="btn sm ghost" data-act="tover" data-i="${i}">Mine was also right</button>`:''}`;
}
function footTest(){
  const sc=scoreTest();
  $('#tfoot').innerHTML=`<div><span class="score mono">${Math.round(sc*10)/10}</span> <span class="muted">/ 30</span><p class="small muted">${sc>=24?'Great score. You’re on track.':sc>=18?'A pass. Look at the red answers and drill those topics.':'Not there yet. Drill the topics with red answers and try again in two days.'}</p></div><div class="row"><button class="btn primary" data-act="newtest">New test</button><button class="btn" data-act="home">Scores</button></div>`;
  $('#tfoot').scrollIntoView({behavior:'smooth',block:'center'});
}
$('#p-test').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;

  if(a==='newtest'){newTest();window.scrollTo({top:0})}

});

function spell(name){
  const map=Object.fromEntries(ABC.map(([L,n])=>[L,n]));
  const one=w=>[...w].map(ch=>{const base=ch.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');const L=ch.toUpperCase()==='Ñ'?'Ñ':base;const n=map[L];if(!n)return ch;return n+(base!==ch.toUpperCase()&&L!=='Ñ'?' con tilde':'')}).join(', ');
  return name.trim().split(/\s+/).map(one).join(' / ');
}

 ['mexico','¡Viva México!','Reach Ciudad de México on the route','MX',()=>levelOf(S.xp)>=4],
 ['darien','Tapón del Darién','Get from Panamá to Colombia','CO',()=>levelOf(S.xp)>=11],
 ['ushuaia','Fin del mundo','Reach Ushuaia','AR',()=>levelOf(S.xp)>=STOPS.length-1],
 ['buho','Búho','Study after 22:00','22',()=>!!S.flags.owl],
 ['madrugador','Madrugador','Study before 8:00','8',()=>!!S.flags.early]
].map(([id,t,d,ic,test])=>({id,t,d,ic,test}));

let lastPt={x:innerWidth/2,y:innerHeight/3};
document.addEventListener('pointerdown',e=>{lastPt={x:e.clientX,y:e.clientY}},true);
function floatXP(n,label){
  const el=document.createElement('div');el.className='xpf';
  el.textContent='+'+n+' XP'+(label?' · '+label:'');
  el.style.left=Math.min(innerWidth-200,Math.max(8,lastPt.x-40))+'px';
  el.style.top=Math.max(8,lastPt.y-44)+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1100);
}
function toast(title,sub,ic){
  let box=$('#toasts');if(!box){box=document.createElement('div');box.id='toasts';box.className='toasts';document.body.appendChild(box)}
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<span class="badge">${esc(ic||'★')}</span><div><b>${esc(title)}</b>${sub?`<div class="small" style="opacity:.8">${esc(sub)}</div>`:''}</div>`;
  box.appendChild(t);setTimeout(()=>t.remove(),3800);
}
let AC=null;
function sfx(kind){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq={ok:[[660,.07],[880,.1]],bad:[[196,.18]],level:[[523,.11],[659,.11],[784,.11],[1047,.25]],ach:[[784,.09],[1047,.18]],goal:[[587,.1],[880,.2]]}[kind];
    let t=AC.currentTime;
    seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d*.9});
  }catch(e){}
}
function confetti(n=120){
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  const c=document.createElement('canvas');c.className='confetti';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const g=c.getContext('2d');const cs=getComputedStyle(document.documentElement);
  const cols=['--cobalt','--saffron','--good','--bad'].map(v=>cs.getPropertyValue(v).trim()||'#888');
  const P=[...Array(n)].map(()=>({x:innerWidth/2+(Math.random()-.5)*140,y:innerHeight*.35,vx:(Math.random()-.5)*13,vy:-Math.random()*13-4,r:Math.random()*7+4,c:pick(cols),a:Math.random()*6}));
  let t=0;(function f(){t++;g.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);g.restore()});if(t<120)requestAnimationFrame(f);else c.remove()})();
}
function addXP(n,label){
  if(!n)return;
  const before=levelOf(S.xp),t=todayISO(),hadGoal=(S.xpDay[t]||0)>=GOAL;
  S.xp=(S.xp||0)+n;S.xpDay[t]=(S.xpDay[t]||0)+n;
  const h=new Date().getHours();if(h>=22)S.flags.owl=1;if(h<8)S.flags.early=1;
  save();floatXP(n,label);renderHUD();
  if(!hadGoal&&S.xpDay[t]>=GOAL){const s=streak();toast('Daily goal reached',`${s}-day streak. ¡Sigue así!`,String(s));sfx('goal')}
  const after=levelOf(S.xp);if(after>before)levelUp(after);
  checkAch();
}
function levelUp(i){
  const s=STOPS[i];sfx('level');confetti();
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="card stack" style="align-items:center"><span class="chip free">Nueva parada · nivel ${i+1}</span><h2 style="font-size:2rem">${esc(s[0])}</h2><p class="muted">${esc(s[1])}</p><p class="fact">${esc(s[3])} ${sayBtn(s[3])}</p><p class="small muted">${esc(s[4])}</p>${STOPS[i+1]?`<p class="small">Next stop: <b>${esc(STOPS[i+1][0])}</b> at ${STOPS[i+1][2]} XP</p>`:''}<button class="btn primary" data-close>¡Vamos!</button></div>`;
  m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]'))m.remove()});
  document.body.appendChild(m);
}
function checkAch(silent){
  let changed=false;
  ACH.forEach(a=>{if(!S.ach[a.id]){let ok=false;try{ok=a.test()}catch(e){}if(ok){S.ach[a.id]=todayISO();changed=true;if(!silent){toast('Logro: '+a.t,a.d,a.ic);sfx('ach');confetti(60)}}}});
  if(changed)save();
}
const FLAME='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 3.5-1.5 5-1.5 7.5 0 1.4 1 2.5 2.3 2.5 1.6 0 2.4-1.3 2.2-3.2 2.4 1.8 4 4.5 4 7.2 0 4.2-3.4 7-7 7s-7-2.8-7-7c0-5.2 5-7.8 7-14z"/></svg>';
function renderHUD(){
  const i=levelOf(S.xp||0),cur=STOPS[i],nx=STOPS[i+1];
  const pct=nx?((S.xp-cur[2])/(nx[2]-cur[2]))*100:100;
  const st=streak(),td=xpToday(),C=2*Math.PI*9,gp=Math.min(1,td/GOAL);
  $('#hud').innerHTML=`<button class="lvl" data-goto="ruta" aria-label="Open the route"><span class="medal">${i+1}</span><span class="info"><b>${esc(cur[0])} · ${esc(cur[1])}</b><span class="bar"><i style="width:${pct}%"></i></span><small class="mono">${S.xp||0} XP${nx?` · ${nx[2]-S.xp} to ${esc(nx[0])}`:' · ¡fin del mundo!'}</small></span></button>
  <span class="pill flame${st?' on':''}" title="Days in a row you reached your daily goal">${FLAME}<b class="mono">${st}</b><span class="small">day${st===1?'':'s'}</span></span>
  <span class="pill" title="Daily goal: ${GOAL} XP"><svg class="ring" viewBox="0 0 24 24" aria-hidden="true"><circle class="trk" cx="12" cy="12" r="9" fill="none" stroke-width="4"/><circle class="val" cx="12" cy="12" r="9" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C*gp} ${C}" transform="rotate(-90 12 12)"/></svg><b class="mono">${td}</b><span class="small muted">/ ${GOAL} XP</span></span>`;
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-goto]');if(g)go(g.dataset.goto)});

function readiness(){
  const all=Object.keys(CARDS).filter(id=>CARDS[id].deck!=='num');
  const vocab=all.filter(id=>S.cards[id]&&S.cards[id].b>=3).length/all.length;
  const gram=TOPICS.reduce((s,t)=>s+(topicScore(t.id)||0),0)/TOPICS.length;
  const test=S.tests.length?Math.max(...S.tests.map(t=>t.sc))/30:0;
  const oral=ORAL.filter(o=>S.oralMark[o[0]]==='ok').length/ORAL.length;
  const read=READS.reduce((s,r)=>s+Math.min(3,S.reads[r[0]]||0),0)/(READS.length*3);
  const parts=[['Words known well',vocab,.3],['Grammar drills',gram,.3],['Best practice test',test,.2],['Oral answers solid',oral,.1],['Texts read aloud',read,.1]];
  return {total:parts.reduce((s,p)=>s+p[1]*p[2],0),parts};
}
function bossHTML(){
  const R=readiness(),ready=Math.round(R.total*100),hp=100-ready;
  return `<div class="card boss stack"><div class="spread"><div><span class="chip exam">Jefe final</span><h3 style="margin-top:6px">Evaluación 1 · lun 23/11</h3></div><div><b class="score mono">${ready}%</b> <span class="muted small">ready</span></div></div>
  <div class="hp" aria-label="Boss health ${hp}%"><i style="width:${hp}%"></i></div>
  <p class="small muted">The boss has <b>${hp}%</b> health left. Every part below hits it:</p>
  <div class="parts">${R.parts.map(([l,v,w])=>`<div><span class="small">${l} <span class="muted">(${Math.round(w*100)}%)</span></span><span class="bar ${v>=.8?'good':''}"><i style="width:${v*100}%"></i></span><span class="mono small muted">${Math.round(v*100)}%</span></div>`).join('')}</div></div>`;
}

/* ============ RUTA tab ============ */
function renderRuta(){
  const i=levelOf(S.xp||0);
  $('#p-ruta').innerHTML=`
  <div><h2>La Ruta Panamericana</h2><p class="muted small">Every XP moves you down the Panamericana, from Alaska to the end of the world. Keep up your daily goal of ${GOAL} XP and you reach Ushuaia around exam day.</p></div>
  ${bossHTML()}
  <div class="card"><div class="route">${STOPS.map((s,k)=>{const st=k<i?'past':k===i?'here':'next';return `<div class="stop ${st}"><span class="pin"></span><div class="sinfo"><b>${esc(s[0])} <span class="muted small" style="font-weight:400">${esc(s[1])}</span></b>${k<=i?`<span class="fact">${esc(s[3])} ${sayBtn(s[3])}</span><span class="small muted">${esc(s[4])}</span>`:''}${k===i?'<span class="chip test" style="align-self:flex-start">You are here</span>':''}</div><span class="mono small${k<=i?'':' muted'}">${s[2]} XP</span></div>`}).join('')}</div></div>
  <div class="stack"><div class="spread"><h2>Logros</h2><span class="mono small">${Object.keys(S.ach).length} / ${ACH.length}</span></div>
  <div class="achs">${ACH.map(a=>{const on=!!S.ach[a.id];return `<div class="ach${on?' on':''}"><span class="badge">${esc(a.ic)}</span><div><b>${esc(a.t)}</b><span class="small muted">${esc(a.d)}</span></div></div>`}).join('')}</div></div>
  <div class="card stack"><h3>Settings</h3>
   <label class="row" for="snd"><input type="checkbox" id="snd" ${S.sound?'checked':''}> Sound effects</label>
   <h3>Move your progress to another device</h3>
   <p class="small muted">Progress is stored per device (inside Claude it follows your account). Copy the code here and paste it on your other device.</p>
   <div class="row"><button class="btn" data-act="export">Copy progress code</button></div>
   <textarea id="xfer" placeholder="Paste a progress code here" style="min-height:70px" spellcheck="false"></textarea>
   <div class="row"><button class="btn" data-act="import" id="impbtn">Load this progress</button><span id="xmsg" class="small"></span></div>
  </div>`;
}
$('#p-ruta').addEventListener('change',e=>{if(e.target.id==='snd'){S.sound=e.target.checked;save();if(S.sound)sfx('ok')}});
$('#p-ruta').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='export'){
    const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    try{await navigator.clipboard.writeText(code);$('#xmsg').textContent='Copied. Paste it on your other device.'}
    catch(err){const ta=$('#xfer');ta.value=code;ta.select();$('#xmsg').textContent='Select-all and copy the code in the box.'}
  }
  if(b.dataset.act==='import'){
    let obj;try{obj=JSON.parse(decodeURIComponent(escape(atob($('#xfer').value.trim()))))}catch(err){$('#xmsg').textContent='That code doesn’t look right. Copy it again.';return}
    if(!obj||typeof obj!=='object'||!('cards' in obj)){$('#xmsg').textContent='That code doesn’t look right. Copy it again.';return}
    if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Yes, replace my progress here';$('#xmsg').textContent=`This device: ${S.xp||0} XP. Code: ${obj.xp||0} XP.`;return}
    S=Object.assign(blank(),obj);save();renderAll();toast('Progress loaded',(S.xp||0)+' XP','✓');
  }
});

/* ============ CONTRARRELOJ ============ */
let SPRINT=null,SPRT=null;
const GENDER=[...new Set([...Object.values(CARDS).map(c=>c.es),...PLN.map(p=>p[0])].filter(w=>/^(el|la) [a-záéíóúñü]+$/i.test(w)))];
function vocabPool(){const st=Object.keys(S.cards).filter(id=>CARDS[id]&&CARDS[id].deck!=='num');return st.length>=24?st:Object.keys(CARDS).filter(id=>CARDS[id].deck!=='num')}
const SPR={
  verbs:{t:'Verbos',d:'See the person and the verb, tap the right form.',gen(){const v=pick([...Object.keys(REG),...Object.keys(IRR),...Object.keys(IRR)]);const [lab,p]=pick(LABELS);const ok=conj(v,p);const others=[...new Set([0,1,2,3,4,5].map(q=>conj(v,q)))].filter(f=>f!==ok);return {q:`(${lab}) ${v.toUpperCase()}`,sub:REG[v]||IRR_NL[v],ok,opts:shuffle([ok,...shuffle(others).slice(0,3)])}}},
  vocab:{t:'Palabras',d:'See the Dutch word, tap the Spanish one. Uses the words you are learning.',gen(){const id=pick(vocabPool()),c=CARDS[id];const same=DECKS.find(d=>d.id===c.deck).ids.filter(x=>CARDS[x].es!==c.es);return {q:c.nl,sub:'',ok:c.es,opts:shuffle([c.es,...shuffle(same).slice(0,3).map(x=>CARDS[x].es)])}}},
  gender:{t:'¿El o la?',d:'Masculine or feminine? Tap the article. Watch out for el día, la mano…',gen(){const w=pick(GENDER);const [art,...rest]=w.split(' ');return {q:rest.join(' '),sub:'',ok:art.toLowerCase(),opts:['el','la'],full:w}}}
};
function renderSprint(){
  clearInterval(SPRT);SPRINT=null;
  $('#p-sprint').innerHTML=`<div><h2>Contrarreloj</h2><p class="muted small">60 seconds: answer as many as you can. 5 XP per right answer, a bonus for a new record.</p></div>
  <div class="decks">${Object.entries(SPR).map(([k,m])=>`<div class="card deck"><div class="spread"><h3>${m.t}</h3><span class="small muted">record <b class="mono" style="color:var(--ink)">${S.best[k]||0}</b></span></div><p class="small muted">${m.d}</p><div><button class="btn primary" data-act="splay" data-m="${k}">Play</button></div></div>`).join('')}</div>`;
}
function startSprint(mode){
  clearInterval(SPRT);
  SPRINT={mode,score:0,combo:0,max:0,end:Date.now()+60000,missed:[],lock:false,cur:null};
  $('#p-sprint').innerHTML=`<div class="spread"><button class="btn sm ghost" data-act="squit">← Stop</button><span class="chip test">${SPR[mode].t}</span><span id="ssecs" class="mono">60 s</span></div>
  <div class="timer"><i id="stime"></i></div>
  <div class="spread"><span><b id="sscore" class="score mono">0</b> <span class="muted">points</span></span><span id="scombo" class="chip test" hidden></span></div>
  <div class="flash" style="min-height:150px;padding-top:24px"><div class="front" id="sq"></div><span class="small muted" id="ssub"></span></div>
  <div class="opts" id="sopts"></div>`;
  nextQ();SPRT=setInterval(stick,100);stick();
}
function nextQ(){
  const s=SPRINT;if(!s)return;let it,k=0;
  do{it=SPR[s.mode].gen();k++}while(s.cur&&it.q===s.cur.q&&k<6);
  s.cur=it;s.lock=false;
  $('#sq').textContent=it.q;$('#ssub').textContent=it.sub||'';
  $('#sopts').className='opts'+(it.opts.length===2?' two':'');
  $('#sopts').innerHTML=it.opts.map((o,i)=>`<button class="opt" data-act="sans" data-i="${i}"><span class="kbd">${i+1}</span>${esc(o)}</button>`).join('');
}
function stick(){
  const s=SPRINT;if(!s)return;const left=Math.max(0,s.end-Date.now());
  const el=$('#stime');if(el)el.style.width=(left/600)+'%';
  const ss=$('#ssecs');if(ss)ss.textContent=Math.ceil(left/1000)+' s';
  if(left<=0)endSprint();
}
function sAnswer(i){
  const s=SPRINT;if(!s||s.lock)return;const it=s.cur;const btns=$$('#sopts .opt');
  s.lock=true;
  if(it.opts[i]===it.ok){s.score++;s.combo++;s.max=Math.max(s.max,s.combo);btns[i].classList.add('right');sfx('ok');setTimeout(()=>{if(SPRINT===s)nextQ()},170)}
  else{s.combo=0;btns[i].classList.add('wrongpick');btns[it.opts.indexOf(it.ok)].classList.add('right');sfx('bad');s.missed.push([it.q,it.full||it.ok]);setTimeout(()=>{if(SPRINT===s)nextQ()},800)}
  $('#sscore').textContent=s.score;
  const cb=$('#scombo');cb.hidden=s.combo<3;cb.textContent='combo ×'+s.combo;
}
function endSprint(){
  clearInterval(SPRT);const s=SPRINT;SPRINT=null;if(!s)return;
  const prev=S.best[s.mode]||0,rec=s.score>prev;if(rec)S.best[s.mode]=s.score;save();
  const xp=s.score*5+(rec&&prev>0?25:0);
  const miss=[...new Map(s.missed.map(m=>[m[0],m])).values()].slice(0,10);
  $('#p-sprint').innerHTML=`<div class="card stack" style="align-items:flex-start"><span class="chip ${rec?'free':'test'}">${rec?(prev?'New record!':'First record set'):'Time’s up'}</span>
  <h2><span class="score mono">${s.score}</span> points</h2><p class="muted">Record: <b class="mono">${S.best[s.mode]}</b> · longest combo ×${s.max}</p>
  ${miss.length?`<div class="stack" style="gap:6px;width:100%"><h3>Look at these again</h3><div class="tablewrap"><table class="list">${miss.map(([q,a])=>`<tr><td>${esc(q)}</td><td><b>${esc(a)}</b></td><td>${sayBtn(a)}</td></tr>`).join('')}</table></div></div>`:''}
  <div class="row"><button class="btn primary" data-act="splay" data-m="${s.mode}">Play again</button><button class="btn" data-act="shome">Other games</button></div></div>`;
  if(xp)addXP(xp,'Contrarreloj');
  if(rec&&prev>0)confetti(90);
  autoTick('sprint',s.mode);
}
$('#p-sprint').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='splay')startSprint(b.dataset.m);
  else if(a==='sans')sAnswer(+b.dataset.i);
  else if(a==='squit'){if(SPRINT)SPRINT.end=Date.now();stick()}
  else if(a==='shome')renderSprint();
});
document.addEventListener('keydown',e=>{if(TAB==='sprint'&&SPRINT&&/^[1-4]$/.test(e.key)){const i=+e.key-1;if(SPRINT.cur&&i<SPRINT.cur.opts.length)sAnswer(i)}});

if(window.__PWA__&&'serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}

function markDone(id){S.done[id]=1;if(!S.taskXP[id]){S.taskXP[id]=1;addXP(20,'Task done')}const d=id.split('#')[0];const [a,b]=dayProg(d);if(b&&a===b&&!S.dayBonus[d]){S.dayBonus[d]=1;addXP(50,'Día completo');confetti(80)}}
/* ============ boot ============ */
function renderAll(){renderCountdown();renderHUD();go(TAB)}
try{const t=localStorage.getItem(KEY+':tab');if(t&&document.getElementById('p-'+t))TAB=t}catch(e){}
checkAch(true);
renderAll();
</script>

</body></html>
